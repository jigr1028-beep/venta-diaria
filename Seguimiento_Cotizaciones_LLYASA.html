<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LLYASA · Seguimiento de cotizaciones</title>
<style>
:root{
  /* ====== COLORES LLYASA (cámbialos aquí) ====== */
  --brand:#D71920; --brand-dark:#A8121A; --brand-soft:#FDECEC;
  --ink:#1F2328; --muted:#5B6470; --line:#E3E6EA; --bg:#F4F5F7; --card:#FFFFFF;
  /* estados (reservados, siempre con icono + texto) */
  --ok:#1A7F4B; --ok-soft:#E6F4EC; --warn:#B45309; --warn-soft:#FEF3E2; --crit:#9F1239; --crit-soft:#FDE8EE;
  --radius:14px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
button,select,input{font:inherit;color:inherit}
.hdr{background:var(--ink);color:#fff;border-bottom:5px solid var(--brand)}
.hdr .in{max-width:1280px;margin:auto;padding:16px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.logo{background:var(--brand);color:#fff;font-weight:900;letter-spacing:1px;padding:6px 12px;border-radius:8px;font-size:20px;transform:skewX(-8deg)}
.hdr h1{font-size:20px;margin:0;font-weight:700}
.hdr small{display:block;color:#C9CED6;font-weight:400;font-size:13px}
.hdr .corte{margin-left:auto;text-align:right;font-size:13px;color:#C9CED6}
.hdr .corte b{display:block;color:#fff;font-size:16px}
.wrap{max-width:1280px;margin:auto;padding:18px 20px 60px}
.who{background:var(--card);border-radius:var(--radius);padding:14px 16px;box-shadow:0 1px 3px rgba(0,0,0,.06);margin-bottom:16px}
.who .lbl{font-weight:700;margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);background:#fff;border-radius:999px;padding:7px 16px;cursor:pointer;font-weight:600;transition:.15s}
.chip:hover{border-color:var(--brand)}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.chip small{opacity:.75;font-weight:500;margin-left:6px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border-radius:var(--radius);padding:14px 16px;box-shadow:0 1px 3px rgba(0,0,0,.06);border-left:6px solid var(--line)}
.kpi .t{font-size:13px;color:var(--muted);font-weight:600}
.kpi .v{font-size:28px;font-weight:800;margin:2px 0}
.kpi .s{font-size:13px;color:var(--muted)}
.kpi.red{border-color:var(--brand)} .kpi.ok{border-color:var(--ok)} .kpi.warn{border-color:#F59E0B} .kpi.crit{border-color:var(--crit)} .kpi.dark{border-color:var(--ink)}
.delta{font-weight:700;font-size:13px}.delta.up{color:var(--ok)}.delta.down{color:var(--crit)}
.tabs{display:flex;gap:6px;margin:6px 0 14px;border-bottom:2px solid var(--line)}
.tab{padding:10px 18px;border:0;background:none;font-weight:700;color:var(--muted);cursor:pointer;border-bottom:4px solid transparent;margin-bottom:-2px;font-size:15px}
.tab.on{color:var(--brand);border-color:var(--brand)}
.card{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.card h2{margin:0 0 4px;font-size:17px}
.card .sub{color:var(--muted);font-size:13px;margin-bottom:12px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:14px;margin-bottom:16px}
.first{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.pri{border:2px solid var(--line);border-radius:12px;padding:10px 12px;position:relative;background:#fff}
.pri .n{position:absolute;top:-10px;left:-8px;background:var(--brand);color:#fff;font-weight:800;border-radius:50%;width:26px;height:26px;display:grid;place-items:center;font-size:13px}
.pri .m{font-size:20px;font-weight:800}
.pri .c{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pri .r{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700;white-space:nowrap}
.b-venc{background:var(--crit-soft);color:var(--crit)}.b-porv{background:var(--warn-soft);color:var(--warn)}.b-vig{background:var(--ok-soft);color:var(--ok)}.b-new{background:#E8EEFB;color:#1D4ED8}
/* barras */
.bar-row{display:grid;grid-template-columns:210px 1fr 90px;gap:10px;align-items:center;margin:7px 0;cursor:default}
.bar-row.click{cursor:pointer}.bar-row.click:hover .bl{color:var(--brand)}
.bl{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bt{background:#EEF0F3;border-radius:6px;height:20px;overflow:hidden}
.bf{height:100%;border-radius:0 6px 6px 0;min-width:3px}
.bv{font-size:13px;font-weight:700;text-align:right}
.cols{display:flex;align-items:flex-end;gap:18px;height:200px;padding:0 6px;border-bottom:2px solid var(--line)}
.col{flex:1;max-width:120px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}
.col .cv{font-size:12.5px;font-weight:800;margin-bottom:4px}
.col .cb{width:100%;border-radius:8px 8px 0 0;min-height:3px}
.collab{display:flex;gap:18px;padding:6px}
.collab div{flex:1;max-width:120px;text-align:center;font-size:12.5px;color:var(--muted)}
/* tabla */
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.tools input[type=search]{flex:1;min-width:220px;padding:9px 12px;border:2px solid var(--line);border-radius:10px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:2px solid var(--line);background:#fff;border-radius:10px;padding:7px 12px;font-weight:600;cursor:pointer}
.seg button.on{border-color:var(--ink);background:var(--ink);color:#fff}
.btn{background:var(--brand);color:#fff;border:0;border-radius:10px;padding:9px 14px;font-weight:700;cursor:pointer}
.btn.alt{background:#fff;color:var(--ink);border:2px solid var(--line)}
.tw{overflow:auto;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:980px;font-size:13.5px}
th{background:#F0F2F5;text-align:left;padding:9px 10px;position:sticky;top:0;cursor:pointer;white-space:nowrap;font-size:12.5px;color:var(--muted);user-select:none}
th.num,td.num{text-align:right}
td{padding:8px 10px;border-top:1px solid var(--line);vertical-align:middle}
tr.done td{opacity:.5}
td.cli{max-width:250px}td.cli b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
td.cli span{color:var(--muted);font-size:12px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
select.seg-s{border:2px solid var(--line);border-radius:8px;padding:5px 6px;background:#fff;font-weight:600}
select.seg-s.s1{background:#E8EEFB;border-color:#93B0F0}select.seg-s.s2{background:var(--warn-soft);border-color:#F5B65C}select.seg-s.s3{background:#F1E8FB;border-color:#BC9BEA}select.seg-s.s4{background:var(--crit-soft);border-color:#F0A0B7}
input.nota{width:190px;border:2px solid var(--line);border-radius:8px;padding:5px 8px}
.prog{height:12px;background:#EEF0F3;border-radius:99px;overflow:hidden;margin:6px 0 2px}
.prog div{height:100%;background:var(--ok);border-radius:99px;transition:.3s}
.hint{color:var(--muted);font-size:12.5px}
.empty{padding:24px;text-align:center;color:var(--muted)}
#tip{position:fixed;pointer-events:none;background:var(--ink);color:#fff;padding:6px 10px;border-radius:8px;font-size:12.5px;z-index:9;display:none;max-width:260px}
.lock{max-width:380px;margin:12vh auto;background:#fff;padding:26px;border-radius:16px;box-shadow:0 4px 20px rgba(0,0,0,.12);text-align:center}
.lock input{width:100%;padding:11px;border:2px solid var(--line);border-radius:10px;margin:12px 0;font-size:16px}
.lock .err{color:var(--crit);font-weight:600;min-height:20px}
@media(max-width:640px){.bar-row{grid-template-columns:100px 1fr 84px}.hdr .corte{margin-left:0;text-align:left}.grid2{grid-template-columns:1fr}}
@media print{.tools,.tabs,.who{display:none}}
</style>
</head>

<script>
"use strict";
const $=s=>document.querySelector(s);
const MXN=n=>"$"+Math.round(n).toLocaleString("es-MX");
const MK=n=>n>=1e6?"$"+(n/1e6).toFixed(2)+" M":n>=1e3?"$"+Math.round(n/1e3)+" K":"$"+Math.round(n);
const ESC=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const MES=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
const fcorta=iso=>{const [y,m,d]=iso.split("-");return +d+" "+MES[+m-1]};
const flarga=iso=>{const [y,m,d]=iso.split("-");return +d+" de "+MES[+m-1]+" "+y};
const SEG=["Sin atender","Contactado","Negociando","Esperando OC","Perdida / cancelada"];
const KEY="llyasa-cot-seguimiento-v1";
let DATA=null, ST={ej:localStorage.getItem("llyasa-cot-ej")||"TODOS",tab:"pend",est:"todas",q:"",sort:"i",dir:-1,lim:50};
let SEGUIM={};try{SEGUIM=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){}
const saveSeg=()=>{try{localStorage.setItem(KEY,JSON.stringify(SEGUIM))}catch(e){}};

/* ---------- arranque (con o sin contraseña) ---------- */
async function descifrar(pw){
  const b=x=>Uint8Array.from(atob(x),c=>c.charCodeAt(0)),e=window.__ENC__,te=new TextEncoder();
  const km=await crypto.subtle.importKey("raw",te.encode(pw),"PBKDF2",false,["deriveKey"]);
  const k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b(e.s),iterations:200000,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b(e.i)},k,b(e.c));
  return JSON.parse(new TextDecoder().decode(pt));
}
async function init(){
  if(window.__DATA__){DATA=window.__DATA__;return start()}
  const saved=localStorage.getItem("llyasa-cot-pw");
  if(saved){try{DATA=await descifrar(saved);return start()}catch(e){localStorage.removeItem("llyasa-cot-pw")}}
  $("#app").innerHTML=`<div class="lock"><div class="logo" style="display:inline-block">LLYASA</div><h2>Seguimiento de cotizaciones</h2><div class="hint">Escribe la clave que te dio tu coordinador</div><input id="pw" type="password" placeholder="Clave" autofocus><div class="err" id="err"></div><button class="btn" id="go" style="width:100%">Entrar</button></div>`;
  const go=async()=>{try{DATA=await descifrar($("#pw").value);localStorage.setItem("llyasa-cot-pw",$("#pw").value);start()}catch(e){$("#err").textContent="Clave incorrecta"}};
  $("#go").onclick=go;$("#pw").onkeydown=e=>{if(e.key==="Enter")go()};
}

/* ---------- cálculos ---------- */
function calc(){
  const S=DATA.snaps,cur=S[S.length-1],prev=S.length>1?S[S.length-2]:null;
  const corte=new Date(cur.fecha+"T00:00:00");
  const enr=r=>{const dias=Math.round((corte-new Date(r.f+"T00:00:00"))/864e5);const rest=r.p-dias;
    return {...r,dias,rest,est:rest<0?"venc":rest<=7?"porv":"vig"}};
  const rows=cur.cot.map(enr);
  const curIds=new Set(rows.map(r=>r.id)),prevIds=prev?new Set(prev.cot.map(r=>r.id)):new Set();
  rows.forEach(r=>r.nueva=!!prev&&!prevIds.has(r.id));
  const cierres=prev?prev.cot.filter(r=>!curIds.has(r.id)):[];
  // historial por corte
  const hist=S.map((s,i)=>{const ids=new Set(s.cot.map(r=>r.id));
    const cer=i>0?S[i-1].cot.filter(r=>!ids.has(r.id)):null;return {fecha:s.fecha,cot:s.cot,cer}});
  return {S,cur,prev,rows,cierres,hist};
}
const inEj=r=>ST.ej==="TODOS"||r.e===ST.ej;
const sum=a=>a.reduce((t,r)=>t+r.i,0);

/* ---------- vista ---------- */
function start(){window.C=calc();const ejs=[...new Set(C.rows.map(r=>r.e).concat(C.cierres.map(r=>r.e)))];
  if(ST.ej!=="TODOS"&&!ejs.includes(ST.ej))ST.ej="TODOS";render()}
function setEj(e){ST.ej=e;ST.lim=50;localStorage.setItem("llyasa-cot-ej",e);render()}
function delta(a,b,inv,neutral){if(b==null)return"";const d=a-b;if(Math.abs(d)<1)return`<span class="delta">= igual que el corte anterior</span>`;
  const good=inv?d<0:d>0;return`<span class="delta ${neutral?"":good?"up":"down"}">${d>0?"▲":"▼"} ${MK(Math.abs(d))} vs corte anterior</span>`}
function bars(items,{color="var(--brand)",click=null,fmt=MK}={}){
  const mx=Math.max(1,...items.map(i=>i.v));
  return items.map(i=>`<div class="bar-row ${click?"click":""}" ${click?`onclick="${click}(${ESC(JSON.stringify(i.k))})"`:""} data-tip="${ESC(i.tip||i.l+": "+fmt(i.v))}">
   <div class="bl" title="${ESC(i.l)}">${ESC(i.l)}</div><div class="bt"><div class="bf" style="width:${i.v/mx*100}%;background:${i.c||color}"></div></div><div class="bv">${fmt(i.v)}</div></div>`).join("")||`<div class="empty">Sin datos</div>`}

function render(){
  const {S,cur,prev,rows,cierres,hist}=C;
  const R=rows.filter(inEj),CI=cierres.filter(inEj);
  const prevR=prev?prev.cot.filter(inEj):null;
  const venc=R.filter(r=>r.est==="venc"),porv=R.filter(r=>r.est==="porv"),nuevas=R.filter(r=>r.nueva);
  const ejs=[...new Set(rows.concat(cierres).map(r=>r.e))].sort((a,b)=>sum(rows.filter(r=>r.e===b))-sum(rows.filter(r=>r.e===a)));
  const hechas=R.filter(r=>(SEGUIM[r.id]?.s||0)>0).length;

  let h=`<div class="hdr"><div class="in"><div class="logo">LLYASA</div><div><h1>Seguimiento de cotizaciones<small>Llantas y Accesorios · cuentas Bachoco y otras</small></h1></div>
   <div class="corte">Corte al<b>${flarga(cur.fecha)}</b>${prev?`<span>anterior: ${fcorta(prev.fecha)}</span>`:""}</div></div></div><div class="wrap">`;

  h+=`<div class="who"><div class="lbl">👤 ¿Quién eres? Elige tu nombre y verás solo tus cotizaciones</div><div class="chips">
   <button class="chip ${ST.ej==="TODOS"?"on":""}" onclick="setEj('TODOS')">Todos<small>${rows.length}</small></button>`+
   ejs.map(e=>`<button class="chip ${ST.ej===e?"on":""}" onclick='setEj(${JSON.stringify(e)})'>${ESC(e)}<small>${rows.filter(r=>r.e===e).length}</small></button>`).join("")+`</div></div>`;

  h+=`<div class="kpis">
   <div class="kpi red"><div class="t">💰 Pendiente por cerrar</div><div class="v">${MK(sum(R))}</div><div class="s">${R.length} cotizaciones</div>${prevR?delta(sum(R),sum(prevR),false,true):""}</div>
   ${prev?`<div class="kpi ok"><div class="t">🎉 Cerradas desde el corte anterior</div><div class="v">${MK(sum(CI))}</div><div class="s">${CI.length} cotizaciones salieron de pendientes</div></div>`:""}
   <div class="kpi dark"><div class="t">🆕 Nuevas este corte</div><div class="v">${prev?nuevas.length:"—"}</div><div class="s">${prev?MK(sum(nuevas))+" en cotizaciones nuevas":"se mostrará desde el segundo corte"}</div></div>
   <div class="kpi warn"><div class="t">⚠️ Vencen en 7 días o menos</div><div class="v">${porv.length}</div><div class="s">${MK(sum(porv))} · ¡da seguimiento ya!</div></div>
   <div class="kpi crit"><div class="t">⛔ Vencidas (más de 30 días)</div><div class="v">${venc.length}</div><div class="s">${MK(sum(venc))} · renovar o cerrar</div></div></div>`;

  h+=`<div class="tabs"><button class="tab ${ST.tab==="pend"?"on":""}" onclick="ST.tab='pend';render()">📋 Por cerrar (${R.length})</button>
   ${prev?`<button class="tab ${ST.tab==="cer"?"on":""}" onclick="ST.tab='cer';render()">🎉 Cerradas (${CI.length})</button>`:""}
   <button class="tab ${ST.tab==="graf"?"on":""}" onclick="ST.tab='graf';render()">📈 Mi avance</button></div>`;

  if(ST.tab==="pend")h+=vistaPend(R,hechas);
  else if(ST.tab==="cer")h+=vistaCer(CI,ejs);
  else h+=vistaGraf(R,CI,ejs);
  h+=`<p class="hint" style="margin-top:22px">Datos generados el ${DATA.generado}. Las cotizaciones que ya no aparecen en el reporte del corte siguiente se consideran <b>cerradas</b> (pasaron a pre-factura/factura). Vigencia = 30 días desde la fecha de la cotización.</p></div>`;
  $("#app").innerHTML=h;wireTips();
}

function vistaPend(R,hechas){
  const top=R.filter(r=>(SEGUIM[r.id]?.s||0)<4).sort((a,b)=>b.i-a.i).slice(0,8);
  let h=`<div class="card" style="margin-bottom:16px"><h2>🔥 Atiende primero — las 8 más grandes</h2><div class="sub">Ordenadas por monto. Las marcadas como “Perdida” ya no aparecen aquí.</div><div class="first">`+
   top.map((r,i)=>`<div class="pri"><div class="n">${i+1}</div><div class="m">${MXN(r.i)}</div><div class="c" title="${ESC(r.c)}">${ESC(r.c)}</div><div class="r">${ESC(r.id)} · ${ESC(r.r)}</div><div style="margin-top:6px">${badge(r)}</div></div>`).join("")+`</div></div>`;
  const pct=R.length?Math.round(hechas/R.length*100):0;
  h+=`<div class="card"><h2>Mi seguimiento</h2><div class="prog"><div style="width:${pct}%"></div></div><div class="hint">${hechas} de ${R.length} cotizaciones ya con seguimiento (${pct}%). Tu seguimiento y notas se guardan en este equipo y navegador.</div>
   <div class="tools" style="margin-top:12px"><input type="search" id="q" placeholder="🔍 Buscar cliente, cotización, referencia o sucursal…" value="${ESC(ST.q)}" oninput="ST.q=this.value;ST.lim=50;tabla()">
   <div class="seg">${[["todas","Todas"],["venc","⛔ Vencidas"],["porv","⚠️ Por vencer"],["vig","✅ Vigentes"],["nueva","🆕 Nuevas"],["sinat","Sin atender"]].map(([k,l])=>`<button class="${ST.est===k?"on":""}" onclick="ST.est='${k}';ST.lim=50;render()">${l}</button>`).join("")}</div>
   <button class="btn alt" onclick="exportar()">⬇ Descargar mi seguimiento (Excel/CSV)</button></div><div id="tabla"></div></div>`;
  setTimeout(tabla,0);return h;
}
const badge=r=>r.est==="venc"?`<span class="badge b-venc">⛔ Vencida hace ${-r.rest} d</span>`:r.est==="porv"?`<span class="badge b-porv">⚠️ Vence en ${r.rest} d</span>`:`<span class="badge b-vig">✅ Vigente · ${r.rest} d</span>`;

function filtrada(){
  const q=ST.q.trim().toLowerCase();
  let a=C.rows.filter(inEj);
  if(ST.est==="venc"||ST.est==="porv"||ST.est==="vig")a=a.filter(r=>r.est===ST.est);
  else if(ST.est==="nueva")a=a.filter(r=>r.nueva);
  else if(ST.est==="sinat")a=a.filter(r=>!(SEGUIM[r.id]?.s>0));
  if(q)a=a.filter(r=>(r.c+" "+r.id+" "+r.r+" "+r.s).toLowerCase().includes(q));
  const k=ST.sort;a.sort((x,y)=>{let u=x[k],v=y[k];if(k==="seg"){u=SEGUIM[x.id]?.s||0;v=SEGUIM[y.id]?.s||0}
    return (typeof u==="number"?u-v:String(u).localeCompare(String(v)))*ST.dir});
  return a;
}
function tabla(){
  const a=filtrada(),vis=a.slice(0,ST.lim);
  const th=(k,l,n)=>`<th class="${n?"num":""}" onclick="ordenar('${k}')">${l}${ST.sort===k?(ST.dir>0?" ▲":" ▼"):""}</th>`;
  $("#tabla").innerHTML=`<div class="hint" style="margin-bottom:6px">${a.length} cotizaciones · ${MXN(sum(a))}</div><div class="tw" style="max-height:640px"><table><thead><tr>
   ${th("i","Importe",1)}${th("c","Cliente / referencia")}${th("id","Cotización")}${th("s","Sucursal")}${th("dias","Antigüedad",1)}${th("rest","Vigencia")}${ST.ej==="TODOS"?th("e","Ejecutivo"):""}${th("seg","Mi seguimiento")}<th>Nota</th></tr></thead><tbody>`+
   (vis.map(r=>{const s=SEGUIM[r.id]||{};return`<tr class="${s.s===4?"done":""}"><td class="num"><b>${MXN(r.i)}</b></td>
   <td class="cli"><b title="${ESC(r.c)}">${r.nueva?'<span class="badge b-new">NUEVA</span> ':""}${ESC(r.c)}</b><span title="${ESC(r.r)}">${ESC(r.r)}${r.sp?" · 🛠 "+ESC(r.sp):""}</span></td>
   <td style="white-space:nowrap">${ESC(r.id)}</td><td>${ESC(r.s)}</td><td class="num">${r.dias} d</td><td>${badge(r)}</td>${ST.ej==="TODOS"?`<td>${ESC(r.e)}</td>`:""}
   <td><select class="seg-s s${s.s||0}" onchange="setSeg('${ESC(r.id)}',this.value,this)">${SEG.map((n,i)=>`<option value="${i}" ${(s.s||0)===i?"selected":""}>${n}</option>`).join("")}</select></td>
   <td><input class="nota" placeholder="Escribe una nota…" value="${ESC(s.n||"")}" onchange="setNota('${ESC(r.id)}',this.value)"></td></tr>`}).join("")||`<tr><td colspan="9" class="empty">No hay cotizaciones con ese filtro 🎯</td></tr>`)+`</tbody></table></div>`+
   (a.length>vis.length?`<div style="text-align:center;margin-top:10px"><button class="btn alt" onclick="ST.lim+=100;tabla()">Ver más (${a.length-vis.length} restantes)</button></div>`:"");
}
function ordenar(k){if(ST.sort===k)ST.dir*=-1;else{ST.sort=k;ST.dir=(k==="c"||k==="id"||k==="s"||k==="e")?1:-1}tabla()}
function setSeg(id,v,el){(SEGUIM[id]=SEGUIM[id]||{}).s=+v;SEGUIM[id].t=Date.now();saveSeg();el.className="seg-s s"+v;
  const R=C.rows.filter(inEj),h=R.filter(r=>(SEGUIM[r.id]?.s||0)>0).length;render()}
function setNota(id,v){(SEGUIM[id]=SEGUIM[id]||{}).n=v;saveSeg()}
function exportar(){
  const a=filtrada(),q=v=>'"'+String(v??"").replace(/"/g,'""')+'"';
  const L=[["Ejecutivo","Cotización","Fecha","Cliente","Referencia","Sucursal","Importe","Días","Vigencia","Seguimiento","Nota"].map(q).join(",")];
  a.forEach(r=>{const s=SEGUIM[r.id]||{};L.push([r.e,r.id,r.f,r.c,r.r,r.s,r.i,r.dias,r.est==="venc"?"Vencida":r.est==="porv"?"Por vencer":"Vigente",SEG[s.s||0],s.n||""].map(q).join(","))});
  const b=new Blob(["﻿"+L.join("\n")],{type:"text/csv;charset=utf-8"}),u=URL.createObjectURL(b),x=document.createElement("a");
  x.href=u;x.download="mi_seguimiento_"+C.cur.fecha+".csv";x.click();URL.revokeObjectURL(u)}

function vistaCer(CI,ejs){
  if(!CI.length)return`<div class="card empty">Aún no hay cotizaciones cerradas entre estos dos cortes.</div>`;
  const por=ST.ej==="TODOS"?`<div class="card" style="margin-bottom:16px"><h2>Cierres por ejecutivo</h2><div class="sub">Monto de cotizaciones que salieron de pendientes</div>${bars(ejs.map(e=>({k:e,l:e,v:sum(CI.filter(r=>r.e===e)),tip:e+": "+CI.filter(r=>r.e===e).length+" cotizaciones"})).filter(x=>x.v>0).sort((a,b)=>b.v-a.v),{color:"var(--ok)",click:"setEj"})}</div>`:"";
  return por+`<div class="card"><h2>🎉 ${CI.length} cotizaciones cerradas · ${MXN(sum(CI))}</h2><div class="sub">Estaban en el corte del ${fcorta(C.prev.fecha)} y ya no están en el del ${fcorta(C.cur.fecha)}.</div>
   <div class="tw" style="max-height:600px"><table style="min-width:760px"><thead><tr><th class="num">Importe</th><th>Cliente / referencia</th><th>Cotización</th><th>Sucursal</th><th>Fecha</th>${ST.ej==="TODOS"?"<th>Ejecutivo</th>":""}</tr></thead><tbody>`+
   [...CI].sort((a,b)=>b.i-a.i).map(r=>`<tr><td class="num"><b>${MXN(r.i)}</b></td><td class="cli"><b>${ESC(r.c)}</b><span>${ESC(r.r)}</span></td><td>${ESC(r.id)}</td><td>${ESC(r.s)}</td><td>${fcorta(r.f)}</td>${ST.ej==="TODOS"?`<td>${ESC(r.e)}</td>`:""}</tr>`).join("")+`</tbody></table></div></div>`;
}

function vistaGraf(R,CI,ejs){
  const H=C.hist;
  const pend=H.map(s=>({l:"al "+fcorta(s.fecha),v:sum(s.cot.filter(inEj))}));
  const cer=H.filter(s=>s.cer).map(s=>({l:"al "+fcorta(s.fecha),v:sum(s.cer.filter(inEj))}));
  const col=(arr,color)=>{const mx=Math.max(1,...arr.map(a=>a.v));return`<div class="cols">${arr.map(a=>`<div class="col" data-tip="${ESC(a.l+": "+MXN(a.v))}"><div class="cv">${MK(a.v)}</div><div class="cb" style="height:${a.v/mx*150}px;background:${color}"></div></div>`).join("")}</div><div class="collab">${arr.map(a=>`<div>${a.l}</div>`).join("")}</div>`};
  const vig=[["Vencidas","venc","var(--crit)"],["Vencen en ≤7 días","porv","#D97706"],["Vigentes","vig","var(--ok)"]].map(([l,k,c])=>({l,c,v:sum(R.filter(r=>r.est===k)),tip:l+": "+R.filter(r=>r.est===k).length+" cotizaciones"}));
  const cli={};R.forEach(r=>{const k=r.c.replace(/\s+/g," ");cli[k]=(cli[k]||0)+r.i});
  const topc=Object.entries(cli).sort((a,b)=>b[1]-a[1]).slice(0,8).map(([k,v])=>({l:k,v}));
  let h=`<div class="grid2"><div class="card"><h2>Pendiente por cerrar, corte a corte</h2><div class="sub">${ST.ej==="TODOS"?"Todos los ejecutivos":ESC(ST.ej)}</div>${col(pend,"var(--ink)")}</div>
   <div class="card"><h2>Cerrado entre cortes</h2><div class="sub">Cotizaciones que salieron de pendientes</div>${cer.length?col(cer,"var(--ok)"):'<div class="empty">Se verá desde el segundo corte</div>'}</div></div>
   <div class="grid2"><div class="card"><h2>¿Qué tan vigente está mi cartera?</h2><div class="sub">Monto pendiente según vigencia de 30 días</div>${bars(vig)}</div>
   <div class="card"><h2>Mis clientes con más monto pendiente</h2><div class="sub">Top 8</div>${bars(topc,{color:"var(--brand)"})}</div></div>`;
  if(ST.ej==="TODOS"){
    h+=`<div class="card"><h2>Ranking por ejecutivo</h2><div class="sub">Toca un nombre para ver solo sus cotizaciones</div>
    <div class="grid2" style="margin:0"><div><b style="font-size:13px">Pendiente por cerrar</b>${bars(ejs.map(e=>({k:e,l:e,v:sum(R.filter(r=>r.e===e)),tip:e+": "+R.filter(r=>r.e===e).length+" cotizaciones"})),{click:"setEj"})}</div>
    <div><b style="font-size:13px">Cerrado desde el corte anterior</b>${bars(ejs.map(e=>({k:e,l:e,v:sum(CI.filter(r=>r.e===e)),tip:e+": "+CI.filter(r=>r.e===e).length+" cotizaciones"})),{color:"var(--ok)",click:"setEj"})}</div></div></div>`;
  }
  return h;
}

/* tooltip */
function wireTips(){const t=$("#tip");document.querySelectorAll("[data-tip]").forEach(el=>{
  el.onmousemove=e=>{t.textContent=el.dataset.tip;t.style.display="block";t.style.left=Math.min(e.clientX+14,innerWidth-270)+"px";t.style.top=(e.clientY+14)+"px"};
  el.onmouseleave=()=>t.style.display="none"})}
init();
</script>
</body>
</html>
