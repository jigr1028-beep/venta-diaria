<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Venta diaria de ejecutivos | LLYASA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&display=swap">
<style>
/* Layout: encabezado con pestañas, filtro de segmento, y paneles de tablero / captura / historial sobre un lienzo gris azulado */
:root{
  --bg:#ffffff; --surface:#ffffff; --ink:#212529; --ink2:#4a5360; --muted:#737d8a;
  --line:#e6e9ee; --line2:#dee2e6; --soft:#f3f5f8;
  --s1:#2a78d6; --s2:#eb6834; --s1t:rgba(42,120,214,.12); --s2t:rgba(235,104,52,.12);
  --good:#0ca30c; --warn:#fab219; --crit:#d03b3b; --goodtxt:#006300; --crittxt:#a82727;
  --ring:rgba(15,23,34,.10); --goodbg:rgba(12,163,12,.14); --critbg:rgba(208,59,59,.13);
  --font:"Ubuntu",system-ui,-apple-system,"Segoe UI",sans-serif; --blue:#0652ca; --navy:#042c53; --navytxt:#7fb2f0;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1117; --surface:#161b23; --ink:#f2f5f9; --ink2:#b7c0cd; --muted:#8a94a3;
  --line:#262d38; --line2:#364050; --soft:#1d2430;
  --s1:#3987e5; --s2:#d95926; --s1t:rgba(57,135,229,.18); --s2t:rgba(217,89,38,.2);
  --goodtxt:#35c235; --crittxt:#ef7a7a; --ring:rgba(255,255,255,.10); --goodbg:rgba(12,163,12,.22); --critbg:rgba(208,59,59,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1117; --surface:#161b23; --ink:#f2f5f9; --ink2:#b7c0cd; --muted:#8a94a3;
  --line:#262d38; --line2:#364050; --soft:#1d2430;
  --s1:#3987e5; --s2:#d95926; --s1t:rgba(57,135,229,.18); --s2t:rgba(217,89,38,.2);
  --goodtxt:#35c235; --crittxt:#ef7a7a; --ring:rgba(255,255,255,.10); --goodbg:rgba(12,163,12,.22); --critbg:rgba(208,59,59,.25); color-scheme:dark}
*{box-sizing:border-box}
body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--font);font-variant-numeric:tabular-nums}
.wrap{max-width:1240px;margin:0 auto;padding-inline:16px;padding-block:0 32px}
.sub{margin-bottom:18px}
.banner{font-size:12px;color:var(--ink2);background:var(--soft);border:1px dashed var(--line2);border-radius:6px;padding:8px 12px;margin-bottom:16px}
.banner b{color:var(--ink)}
h1{font-size:30px;line-height:1.2;margin:24px 0 2px;font-weight:500}
.sub{color:var(--muted);font-size:13px;margin-top:2px}
.navs{display:flex;gap:6px 28px;flex-wrap:wrap}
.tab{appearance:none;background:none;border:0;border-bottom:2px solid transparent;color:#fff;font:700 15px var(--font);padding:6px 0;cursor:pointer;white-space:nowrap}
.tab[aria-selected=true]{border-bottom-color:#fff}
.tab:hover{border-bottom-color:rgba(255,255,255,.6)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.site{background:var(--blue);color:#fff}
.site .in{max-width:1240px;margin:0 auto;padding:22px 16px;display:flex;gap:16px 32px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.logo{display:block;height:46px;width:auto;max-width:100%}
footer.f{margin-top:40px;padding-top:16px;border-top:1px solid var(--line);color:var(--ink2);font-size:14px}
.bar{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end;margin-bottom:16px}
.seg{--sl:22px;display:inline-flex;background:var(--navy);isolation:isolate}
.seg button{position:relative;appearance:none;border:0;background:transparent;color:var(--navytxt);font:500 14px var(--font);padding:10px calc(var(--sl) + 14px) 10px 22px;cursor:pointer;display:flex;gap:7px;align-items:center;clip-path:polygon(0 0,100% 0,calc(100% - var(--sl)) 100%,0 100%)}
.seg button+button{margin-left:calc(var(--sl) * -1);padding-left:calc(var(--sl) + 12px)}
.seg button:last-child{clip-path:none;padding-right:22px}
.seg button:nth-child(1){z-index:6}.seg button:nth-child(2){z-index:5}.seg button:nth-child(3){z-index:4}.seg button:nth-child(4){z-index:3}
.seg button[aria-pressed=true]{background:var(--blue);color:#fff;font-weight:700}
.seg.sm{--sl:14px}.seg.sm button{padding-top:6px;padding-bottom:6px;font-size:13px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.field{display:flex;flex-direction:column;gap:4px;align-items:flex-start;color:var(--ink);font-size:14px}
select,input.num{font:400 14px var(--font);color:var(--ink);background:var(--surface);border:1px solid var(--line2);border-radius:6px;padding:7px 12px;min-height:38px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-width:0}
.kpi .l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.kpi .v{font-size:26px;font-weight:600;letter-spacing:-.02em;margin-top:4px;line-height:1.15}
.kpi .n{font-size:12.5px;color:var(--ink2);margin-top:4px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px;min-width:0}
.panel h2{font-size:15px;margin:0 0 2px;font-weight:600}
.panel .hint{color:var(--muted);font-size:12.5px;margin-bottom:10px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2);margin:6px 0 4px}
.legend span{display:inline-flex;gap:6px;align-items:center}
.ldash{width:18px;border-top:2px dashed var(--muted);display:inline-block}
.chartbox{position:relative}
svg.chart{width:100%;height:auto;display:block}
.tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--line2);border-radius:8px;padding:8px 10px;font-size:12.5px;box-shadow:0 4px 14px var(--ring);min-width:170px;z-index:3}
.tip b{display:block;margin-bottom:4px}
.tip div{display:flex;justify-content:space-between;gap:14px;color:var(--ink2)}
.tip div span:first-child{display:inline-flex;gap:6px;align-items:center}
.scroll{overflow-x:auto}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
th{font-weight:500;color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.02em;text-align:right;padding:8px 6px;border-bottom:1px solid var(--line2);white-space:nowrap;background:var(--surface)}
td{padding:9px 5px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
td.name{font-weight:500;max-width:150px;overflow:hidden;text-overflow:ellipsis}
tr.grp td{background:var(--soft);font-weight:600;font-size:12.5px;border-bottom:1px solid var(--line2)}
tr.tot td{font-weight:600;border-top:1px solid var(--line2);background:var(--surface)}
.gname{display:inline-flex;gap:8px;align-items:center}
.pb{display:inline-flex;align-items:center;gap:8px;justify-content:flex-end}
.pb i{display:block;width:26px;height:6px;border-radius:3px;background:var(--soft);position:relative;overflow:hidden}
.pb i s{position:absolute;inset:0 auto 0 0;border-radius:3px}
.pill{display:inline-flex;gap:6px;align-items:center;font-size:12px;font-weight:500;padding:2px 9px 2px 7px;border-radius:99px;border:1px solid var(--line2);color:var(--ink)}
.pill svg{width:11px;height:11px;flex:none}
.yn{display:inline-flex;gap:5px;align-items:center;font-weight:600;font-size:12px;padding:2px 10px 2px 8px;border-radius:99px}.yn svg{width:11px;height:11px}.yn.si{background:var(--goodbg);color:var(--goodtxt)}.yn.no{background:var(--critbg);color:var(--crittxt)}
.neg{color:var(--crittxt)} .pos{color:var(--goodtxt)}
.spark{display:block;margin-left:auto}
input.cap{width:140px;text-align:right}
input.cap.bad{border-color:var(--crit);outline-color:var(--crit)}
.note{font-size:12.5px;color:var(--ink2);background:var(--soft);border-radius:6px;padding:8px 12px;margin-bottom:12px}
.btn{appearance:none;border:1px solid var(--blue);background:var(--blue);color:#fff;font:500 14px var(--font);padding:8px 16px;border-radius:6px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--blue);border:1px solid var(--blue)}
.adm{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;background:var(--soft);border:1px solid var(--line2);border-radius:6px;padding:10px 14px;margin-bottom:16px;font-size:13.5px}
.adm.dirty{border-color:var(--warn)}
.hm td,.hm th{padding:6px 8px;font-size:12px}
.hm td:first-child,.hm th:first-child{position:sticky;left:0;background:var(--surface);z-index:1;border-right:1px solid var(--line)}
.hm td.hit{background:var(--tint)}
.hm td.zero{color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
.toast.on{opacity:1}
.cols2{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:12px}
.top{display:grid;grid-template-columns:minmax(0,400px) minmax(0,1fr);gap:12px;margin-bottom:16px;align-items:stretch}
.top .kpis{grid-template-columns:1fr 1fr;margin:0;gap:10px}
.top .kpi{padding:10px 12px}.top .kpi .v{font-size:20px}.top .kpi .n{font-size:11.5px}
.top .panel{margin:0}

th.w{white-space:normal;line-height:1.15;min-width:56px;max-width:80px}
.grip{cursor:grab;color:var(--muted);user-select:none;text-align:center;width:28px}
tr.over td{box-shadow:inset 0 2px 0 var(--s1)}
.btn.sm{padding:3px 9px;font-size:13px}.btn:disabled{opacity:.35;cursor:default}
table.cfg td{padding:6px}table.cfg th:nth-child(3),table.cfg td:nth-child(3){text-align:left}
@media (max-width:900px){.top{grid-template-columns:minmax(0,1fr)}}
@media (max-width:640px){.hide-s{display:none}.kpi .v{font-size:22px}}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
.medal{font-size:15px;margin-right:2px}.pick{cursor:pointer}.pick:hover td{background:var(--soft)}.pick.on td{background:var(--s1t)}.pick.on td:first-child{box-shadow:inset 3px 0 0 var(--s1)}</style></head><body>

    return `<tr class="pick ${st.sel==='ty:'+idx?'on':''}" data-sel="ty:${idx}"><td class="name" title="${r.n}">${r.n}</td><td>${hc?L.m:'—'}</td><td>${hc?hoy:'—'}</td><td>${hc?YN(hoy>=L.m):'—'}</td><td>${hc?bar(ac/(L.m*st.cut)):'—'}</td><td>${hl?C.asig:'—'}</td><td>${hl?cc:'—'}</td><td>${hl?bar(cc/C.asig):'—'}</td><td>${hl?C.asig-cc:'—'}</td></tr>`}).join('');
  const T=list.reduce((a,{r})=>{const x=info(r);if(x.L.m>0){a.m+=x.L.m;a.h+=x.hoy;a.ac+=x.ac}if(x.C.asig>0){a.A+=x.C.asig;a.c+=x.cc}return a},{m:0,h:0,ac:0,A:0,c:0});
  return `<h2 style="margin:20px 0 2px;font-size:14px">Llamadas y cartera de clientes</h2><div class="hint">Llamadas: meta fija por ejecutivo. Clientes con compra: clientes de su cartera que ya compraron en el mes, al corte del día ${st.cut}.</div>
  <div class="scroll"><table><thead><tr><th>Ejecutivo</th><th>Meta llamadas/día</th><th>Llamadas día ${st.cut}</th><th>Cumple hoy</th><th>% meta de llamadas del mes</th><th>Clientes asignados</th><th>Con compra</th><th>Penetración</th><th>Sin compra</th></tr></thead><tbody>${rows}<tr class="tot"><td>Total TYCMORS</td><td>${T.m||'—'}</td><td>${T.m?T.h:'—'}</td><td>${T.m?YN(T.h>=T.m):'—'}</td><td>${T.m?pc(T.ac/(T.m*st.cut)):'—'}</td><td>${T.A||'—'}</td><td>${T.A?T.c:'—'}</td><td>${T.A?pc(T.c/T.A):'—'}</td><td>${T.A?T.A-T.c:'—'}</td></tr></tbody></table></div>`
}
function execTable(){
  const rem=HAB-st.cut;
  return visSegs().map((s,k)=>{
    if(!hasData(s))return `<div class="panel"><h2><span class="gname"><i class="dot" style="background:${s.c}"></i>${s.name}</span></h2><div class="hint" style="margin:0">Sin ventas capturadas en ${mlabel(MKEY)}.</div></div>`;
    const T=segTotals(s,st.cut),ty=s.id==='ty';
    let list=s.rows.map(r=>({r,c:calc(r,st.cut)}));
    if(st.sort==='ritmo')list.sort((a,b)=>b.c.ritmo-a.c.ritmo);
    const need=c=>rem>0?Math.max(0,(c.od*HAB-c.acum)/rem)/COSTO:0;
    let body=list.map(({r,c})=>`<tr class="pick ${st.sel===s.id+':'+s.rows.indexOf(r)?'on':''}" data-sel="${s.id}:${s.rows.indexOf(r)}" title="Clic para ver su avance arriba"><td class="name" title="${r.n}">${(m=>m?`<span class="medal" title="${m[1]}">${m[0]}</span> `:'<span class="medal" style="visibility:hidden">⭐</span> ')(medal(c))}${r.n}</td><td>${money(r.o)}</td><td>${money(c.last)}</td>
      <td>${pc(c.pl)}</td><td>${YN(c.last>=c.od-0.005)}</td><td>${money(c.acum)}</td>
      <td><span class="pb">${pc(c.pm)}<i><s style="width:${Math.min(c.pm,1)*100}%;background:${s.c}"></s></i></span></td>
      <td class="${c.dif<0?'neg':'pos'}">${sgn(c.dif)}</td><td>${money(c.avg)}</td>${ty?`<td>${rem>0?Math.ceil(need(c)).toLocaleString('es-MX'):'—'}</td><td>${Math.round(c.avg/COSTO).toLocaleString('es-MX')}</td>`:''}<td>${pill(c.ritmo)}</td></tr>`).join('');
    const tn=list.reduce((a,x)=>a+need(x.c),0);
    body+=`<tr class="tot"><td>Total ${s.name}</td><td>${money(T.o)}</td><td>${money(T.last)}</td><td>${pc(T.pl)}</td><td>${YN(T.last>=T.od)}</td><td>${money(T.acum)}</td>
     <td><span class="pb">${pc(T.pm)}<i><s style="width:${Math.min(T.pm,1)*100}%;background:${s.c}"></s></i></span></td><td class="${T.dif<0?'neg':'pos'}">${sgn(T.dif)}</td><td>${money(T.avg)}</td>${ty?`<td>${rem>0?Math.ceil(tn).toLocaleString('es-MX'):'—'}</td><td>${Math.round(T.avg/COSTO).toLocaleString('es-MX')}</td>`:''}<td>${pill(T.ritmo)}</td></tr>`;
    const hint=k===0?`⭐ Cumplió el objetivo del día · 🔥 Vendió 150% o más del objetivo · 🏆 Vendió el doble o más del objetivo · Haz clic en un ejecutivo para ver su avance arriba`:'';
    const lh=ty?`<th class="w" title="Lo que falta del objetivo ÷ días hábiles restantes ÷ costo promedio de llanta">Llantas/día necesarias</th><th class="w" title="Promedio diario vendido ÷ costo promedio de llanta">Llantas/día vendidas</th>`:'';
    return `<div class="panel"><h2><span class="gname"><i class="dot" style="background:${s.c}"></i>${s.name}</span></h2>
    <div class="hint">${hint}${ty?` Llantas calculadas con costo promedio de ${money(COSTO)} (editable en Configuración).`:''}</div>
    <div class="scroll"><table><thead><tr><th>Ejecutivo</th><th>Obj. mensual</th><th>Venta día ${st.cut}</th><th>% obj. diario</th><th>Cumple hoy</th><th>Acumulado</th><th>% avance mes</th><th>Dif. vs ritmo</th><th>Prom. diario</th>${lh}<th>Ritmo del mes</th></tr></thead><tbody>${body}</tbody></table></div>${ty&&list.some(x=>hasCalls(x.r)||hasCli(x.r))?callsTable(list):''}</div>`}).join('')
}
function tablero(){
  const ld=lastDay();
  if(!ld||!dataSegs().length)return `<div class="panel"><h2>Todavía no hay ventas en ${mlabel(MKEY)}</h2><div class="hint" style="margin:0">${st.admin?'Abre Captura del día y registra el acumulado del día hábil 1.':'La venta del mes aparecerá aquí en cuanto se capture el primer día.'}</div></div>`;
  return `<div class="bar"><label class="field">Corte al día hábil <select id="cut">${Array.from({length:ld},(_,i)=>`<option value="${i+1}" ${i+1===st.cut?'selected':''}>${i+1}</option>`).join('')}</select></label>
  <div class="field">Orden <div class="seg sm" role="group" aria-label="Orden de ejecutivos">${[['manual','Manual'],['ritmo','Por ritmo']].map(([id,n])=>`<button data-sort="${id}" aria-pressed="${st.sort===id}">${n}</button>`).join('')}</div></div></div>`+`<div class="top">${st.sel&&selRow()?kpisSel():kpis()}${st.sel&&selRow()?chartSel():chart()}</div>`+execTable();
}

/* ---------- Captura ---------- */
function captura(){
  const s=SEGS.find(x=>x.id===st.capSeg),day=st.capDay;
  const rows=s.rows.map((r,i)=>{
    const prev=sumTo(r,day-1),v=r.d[day-1],od=r.o/HAB;
    return `<tr data-i="${i}" data-prev="${prev}"><td class="name">${r.n}</td><td>${money(od)}</td><td>${money(prev)}</td>
    <td><input class="num cap" id="cap${i}" inputmode="decimal" value="${v===null?'':Math.round((prev+v)*100)/100}" placeholder="Acumulado CRM" aria-label="Acumulado CRM ${r.n}"></td>
    <td class="vd">—</td><td class="pd">—</td><td class="sd"></td>${s.id==='ty'?`<td><input class="num capll" inputmode="numeric" value="${r.ll&&r.ll.d[day-1]!=null?r.ll.d[day-1]:''}" placeholder="Llamadas" aria-label="Llamadas del día ${r.n}" style="width:90px"></td><td><input class="num capcl" inputmode="numeric" value="${r.cl&&r.cl.d[day-1]!=null?r.cl.d[day-1]:''}" placeholder="Acum. mes" aria-label="Clientes con compra ${r.n}" style="width:90px"></td>`:''}</tr>`}).join('');
  return `<div class="bar"><div class="seg" role="group" aria-label="Segmento a capturar">${SEGS.map(x=>`<button data-capseg="${x.id}" aria-pressed="${x.id===st.capSeg}"><span class="dot" style="background:${x.c}"></span>${x.name}</button>`).join('')}</div>
   <label class="field">Día hábil <select id="capday">${Array.from({length:HAB},(_,i)=>`<option value="${i+1}" ${i+1===day?'selected':''}>Día hábil ${i+1}</option>`).join('')}</select></label></div>
   <div class="note">Captura el <b>acumulado del mes</b> que te da el CRM. La venta del día se calcula sola restando el acumulado del día anterior. Los números del día ${day} ya están cargados para que veas la resta.${s.id==='ty'?' En TYCMORS captura también las <b>llamadas del día</b> (total de ese día) y los <b>clientes con compra</b> (acumulado del mes).':''}</div>
   <div class="panel"><div class="scroll"><table><thead><tr><th>Ejecutivo</th><th>Obj. diario</th><th>Acumulado día ${day-1}</th><th>Acumulado CRM día ${day}</th><th>Venta del día</th><th>% obj. diario</th><th>Revisión</th>${s.id==='ty'?'<th>Llamadas del día</th><th>Clientes con compra (acum. mes)</th>':''}</tr></thead><tbody>${rows}
   <tr class="tot"><td>Total ${s.name}</td><td id="tod"></td><td id="tprev"></td><td id="tacum"></td><td id="tvd"></td><td id="tpd"></td><td></td>${s.id==='ty'?'<td></td><td></td>':''}</tr></tbody></table></div>
   <div class="cols2" style="margin:14px 0 0"><span class="hint" id="capmsg" style="margin:0"></span><div style="display:flex;gap:8px"><button class="btn ghost" id="capclr">Limpiar día</button><button class="btn" id="capsave">Guardar día ${day}</button></div></div></div>`
}
function capRecalc(){
  const s=SEGS.find(x=>x.id===st.capSeg);let tp=0,ta=0,tv=0,tod=0,bad=0,pre=0;
  document.querySelectorAll('#view tr[data-i]').forEach(tr=>{
    const i=+tr.dataset.i,prev=+tr.dataset.prev,od=s.rows[i].o/HAB,inp=tr.querySelector('input'),raw=inp.value.trim().replace(/,/g,'');
    tp+=prev;tod+=od;pre+=0;
    const sd=tr.querySelector('.sd');
    if(raw===''){tr.querySelector('.vd').textContent='—';tr.querySelector('.pd').textContent='—';sd.textContent='Sin capturar';inp.classList.remove('bad');return}
    const a=parseFloat(raw);
    if(isNaN(a)){inp.classList.add('bad');sd.innerHTML='<span class="neg">No es un número</span>';bad++;return}
    const v=a-prev;ta+=a;
    tr.querySelector('.vd').textContent=money(v);tr.querySelector('.pd').textContent=pc(v/od);
    if(v<0){inp.classList.add('bad');sd.innerHTML='<span class="neg">Menor al día anterior</span>';bad++}
    else{inp.classList.remove('bad');sd.innerHTML=v===0?'Sin venta':'<span class="pos">Listo</span>';tv+=v}
  });
  document.querySelectorAll('#view tr[data-i]').forEach(tr=>{const a=tr.querySelector('.capll'),b=tr.querySelector('.capcl');if(!a)return;const r=s.rows[+tr.dataset.i];
    [a,b].forEach(x=>x.classList.remove('bad'));
    const va=a.value.trim(),vb=b.value.trim();
    if(va!==''&&!(parseFloat(va)>=0)){a.classList.add('bad');bad++}
    if(vb!==''&&(!(parseFloat(vb)>=0)||(r.cl&&r.cl.asig>0&&parseFloat(vb)>r.cl.asig))){b.classList.add('bad');bad++}
  });
  $('#tod').textContent=money(tod);$('#tprev').textContent=money(tp);$('#tacum').textContent=money(ta);$('#tvd').textContent=money(tv);$('#tpd').textContent=pc(tod?tv/tod:0);
  $('#capmsg').textContent=bad?`${bad} fila(s) por corregir antes de guardar.`:'Todo en orden para guardar.';
  $('#capsave').disabled=!!bad;$('#capsave').style.opacity=bad?.45:1;
}
function capSave(){
  const s=SEGS.find(x=>x.id===st.capSeg),day=st.capDay;
  document.querySelectorAll('#view tr[data-i]').forEach(tr=>{
    const i=+tr.dataset.i,raw=tr.querySelector('input').value.trim().replace(/,/g,'');
    s.rows[i].d[day-1]=raw===''?null:Math.max(0,parseFloat(raw)-(+tr.dataset.prev));
  });
  if(s.id==='ty')document.querySelectorAll('#view tr[data-i]').forEach(tr=>{const rr=s.rows[+tr.dataset.i],a=tr.querySelector('.capll'),b=tr.querySelector('.capcl'),va=a.value.trim().replace(/,/g,''),vb=b.value.trim().replace(/,/g,'');
    if(va!==''){rr.ll=rr.ll||{m:0,d:pad31([])};rr.ll.d[day-1]=Math.round(parseFloat(va))}else if(rr.ll)rr.ll.d[day-1]=null;
    if(vb!==''){rr.cl=rr.cl||{asig:0,d:pad31([])};rr.cl.d[day-1]=Math.round(parseFloat(vb))}else if(rr.cl)rr.cl.d[day-1]=null});
  const ld=lastDay();if(day>=st.cut&&day<=ld)st.cut=Math.max(st.cut,day);
  toast(`Día ${day} de ${s.name} guardado en este equipo.`);
}

/* ---------- Historial ---------- */
function historial(){
  const ld=lastDay();if(!ld)return `<div class="panel"><div class="hint" style="margin:0">Sin ventas capturadas en ${mlabel(MKEY)}.</div></div>`;const cols=Array.from({length:ld},(_,i)=>i+1);
  const f=n=>n>=1e6?(n/1e6).toFixed(2)+'M':n>=1e3?(n/1e3).toFixed(0)+'k':Math.round(n)+'';
  let body='';
  visSegs().forEach(s=>{
    body+=`<tr class="grp"><td colspan="${ld+2}"><span class="gname"><i class="dot" style="background:${s.c}"></i>${s.name}</span></td></tr>`;
    s.rows.forEach(r=>{const od=r.o/HAB;let a=0;
      body+=`<tr><td class="name" title="${r.n}">${r.n}</td>`+cols.map(d=>{const v=r.d[d-1]||0;a+=v;
        if(st.hist==='acum')return `<td>${f(a)}</td>`;
        return `<td class="${v>=od?'hit':v===0?'zero':''}" style="--tint:${s.t}" title="Día ${d}: ${money(v)}">${v?f(v):'–'}</td>`}).join('')+`<td><b>${f(a)}</b></td></tr>`});
    body+=`<tr class="tot"><td>Total ${s.name}</td>`+(()=>{let a=0;return cols.map(d=>{const v=s.rows.reduce((x,r)=>x+(r.d[d-1]||0),0);a+=v;return `<td>${f(st.hist==='acum'?a:v)}</td>`}).join('')+`<td>${f(a)}</td>`})()+`</tr>`;
  });
  return `<div class="bar"><div class="seg" role="group" aria-label="Vista">${[['dia','Venta del día'],['acum','Acumulado']].map(([id,n])=>`<button data-hist="${id}" aria-pressed="${st.hist===id}">${n}</button>`).join('')}</div>
  <span class="hint" style="margin:0">${st.hist==='dia'?'Las celdas con color alcanzaron el objetivo diario del ejecutivo.':'Acumulado del mes por ejecutivo, día por día.'}</span></div>
  <div class="panel"><div class="scroll"><table class="hm"><thead><tr><th>Ejecutivo</th>${cols.map(d=>`<th>D${String(d).padStart(2,'0')}</th>`).join('')}<th>Total</th></tr></thead><tbody>${body}</tbody></table></div></div>`
}

/* ---------- Configuración ---------- */
function config(){
  const [y,mo]=MKEY.split('-').map(Number),calcd=habCalc(y,mo-1),nk=nextKey(Object.keys(MONTHS).sort().pop());
  const mp=`<div class="panel"><h2>Mes de ${mlabel(MKEY)}</h2><div class="hint">El objetivo diario es el objetivo mensual entre los días hábiles. Calculado de lunes a sábado: <b>${calcd}</b>. Resta los feriados que no se trabajen.</div>
   <div class="bar" style="margin:0"><label class="field">Días hábiles <input class="num" id="hab" type="number" min="1" max="31" value="${HAB}" style="width:80px"></label>
   <button class="btn ghost" id="habcalc">Usar calculado (${calcd})</button>
   <label class="field">Costo promedio llanta de camión <input class="num" id="costo" inputmode="decimal" value="${COSTO}" style="width:100px"></label>
   <span style="flex:1"></span><button class="btn" id="newmonth" ${MONTHS[nk]?'disabled style="opacity:.45"':''}>Crear ${mlabel(nk)}</button></div></div>`;
  const sp=SEGS.map(s=>{
    const tot=s.rows.reduce((a,r)=>a+r.o,0);
    const rows=s.rows.map((r,i)=>`<tr data-seg="${s.id}" data-i="${i}"><td class="grip" draggable="true" title="Arrastra para mover" aria-hidden="true">⋮⋮</td><td>${i+1}</td>
      <td><input class="num nm" value="${r.n.replace(/"/g,'&quot;')}" aria-label="Nombre" style="width:230px"></td>
      <td><input class="num ob" inputmode="decimal" value="${r.o}" aria-label="Objetivo mensual de ${r.n}" style="width:130px;text-align:right"></td><td>${money(r.o/HAB)}</td>${s.id==='ty'?`<td><input class="num lm" inputmode="numeric" value="${r.ll?r.ll.m:''}" placeholder="0" aria-label="Meta de llamadas por día de ${r.n}" style="width:90px;text-align:right"></td><td><input class="num ca" inputmode="numeric" value="${r.cl?r.cl.asig:''}" placeholder="0" aria-label="Clientes asignados de ${r.n}" style="width:90px;text-align:right"></td>`:''}
      <td class="mvc"><button class="btn ghost sm" data-mv="${s.id}:${i}:-1" aria-label="Subir ${r.n}" ${i===0?'disabled':''}>↑</button> <button class="btn ghost sm" data-mv="${s.id}:${i}:1" aria-label="Bajar ${r.n}" ${i===s.rows.length-1?'disabled':''}>↓</button></td></tr>`).join('');
    return `<div class="panel"><h2><span class="gname"><i class="dot" style="background:${s.c}"></i>${s.name}</span></h2><div class="hint">Arrastra el asa ⋮⋮ o usa las flechas para ordenar. Este orden se usa en el tablero, la captura y el historial.</div>
     <div class="scroll"><table class="cfg"><thead><tr><th></th><th>#</th><th>Ejecutivo</th><th>Objetivo mensual</th><th>Objetivo diario</th>${s.id==='ty'?'<th>Meta llamadas/día</th><th>Clientes asignados</th>':''}<th>Mover</th></tr></thead><tbody>${rows}
     <tr class="tot"><td></td><td></td><td>Total ${s.name}</td><td>${money(tot)}</td><td>${money(tot/HAB)}</td>${s.id==='ty'?`<td>${s.rows.reduce((a,x)=>a+(x.ll?x.ll.m:0),0)||''}</td><td>${s.rows.reduce((a,x)=>a+(x.cl?x.cl.asig:0),0)||''}</td>`:''}<td></td></tr></tbody></table></div></div>`}).join('');
  const g=ghCfg()||{};
  const gh=`<div class="panel"><h2>Publicación en GitHub</h2><div class="hint">Con esto, Guardar día publica solo, sin descargar ni subir archivos. El token se guarda únicamente en este navegador.</div>
   <div class="bar" style="margin:0"><label class="field">Usuario<input class="num" id="gh_o" value="${g.o||''}" style="width:170px" autocomplete="off"></label>
   <label class="field">Repositorio<input class="num" id="gh_r" value="${g.r||''}" style="width:170px" autocomplete="off"></label>
   <label class="field">Rama<input class="num" id="gh_b" value="${g.b||'main'}" style="width:90px" autocomplete="off"></label>
   <label class="field">Token<input class="num" id="gh_t" type="password" value="${g.t||''}" style="width:220px" autocomplete="off"></label>
   <button class="btn" id="ghsave">Guardar y probar</button></div></div>`;
  return mp+sp+gh
}

function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2600)}
function paintAdm(){
  const c=ghCfg();
  $('#adm').innerHTML=st.admin?`<div class="adm ${st.dirty?'dirty':''}"><span><b>Modo captura.</b> ${c?(st.dirty?'Hay cambios sin publicar.':'Todo publicado.'):'Publicación en GitHub sin configurar (pestaña Configuración).'} ${st.msg||''}</span><span style="display:flex;gap:8px;flex-wrap:wrap">${c?'<button class="btn" id="pub">Publicar ahora</button>':''}<button class="btn ghost" id="dl">Descargar datos.json</button></span></div>`:'';
}
function render(){
  if(st.admin){const h=JSON.stringify(DB.months);if(h!==st.h){st.h=h;touch()}}
  paintAdm();
  head();
  const v=$('#view');
  v.innerHTML=st.tab==='tablero'?tablero():st.tab==='captura'?captura():st.tab==='config'?config():historial();
  if(st.tab==='tablero'){bindChart();bindSel()}
  if(st.tab==='captura')capRecalc();

const taps=[];
document.addEventListener('click',e=>{
  if(e.target.closest('h1')){const n=Date.now();taps.push(n);while(taps.length&&n-taps[0]>1500)taps.shift();
    if(taps.length>=3){taps.length=0;st.admin=!st.admin;if(!st.admin&&st.tab!=='tablero')st.tab='tablero';const mk=MKEY;pickDB();setMonth(MONTHS[mk]?mk:startMonth());render();toast(st.admin?'Modo captura activado':'Modo captura oculto');return}}
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.seg){st.seg=b.dataset.seg;render()}
  else if(b.dataset.tab){st.tab=b.dataset.tab;render()}
  else if(b.dataset.capseg){st.capSeg=b.dataset.capseg;render()}
  else if(b.dataset.sort){st.sort=b.dataset.sort;render()}
  else if(b.dataset.mv){const [sid,i,dx]=b.dataset.mv.split(':'),s=SEGS.find(x=>x.id===sid),a=+i,c=a+ +dx;if(c>=0&&c<s.rows.length){[s.rows[a],s.rows[c]]=[s.rows[c],s.rows[a]];render()}}
  else if(b.id==='habcalc'){const [y,mo]=MKEY.split('-').map(Number);MONTHS[MKEY].hab=HAB=habCalc(y,mo-1);render()}
  else if(b.id==='newmonth'){const nk=nextKey(Object.keys(MONTHS).sort().pop());newMonth(MKEY,nk);setMonth(nk);st.tab='config';render();toast(mlabel(nk)+' creado con los ejecutivos y objetivos del mes anterior')}
  else if(b.dataset.cm){st.cm=b.dataset.cm;render()}
  else if(b.dataset.hist){st.hist=b.dataset.hist;render()}
  else if(b.id==='dl'){download()}
  else if(b.id==='pub'){publish()}
  else if(b.id==='ghsave'){ghSave()}
  else if(b.id==='capsave'){capSave();render();if(ghCfg())publish()}
  else if(b.id==='capclr'){document.querySelectorAll('#view tr[data-i] input').forEach(i=>i.value='');capRecalc()}
});
document.addEventListener('click',e=>{
  if(e.target.closest('[data-clear]')){st.sel=null;render();return}
  if(e.target.closest('[data-cli]')){st.cli=st.cli===false;render();return}
  if(e.target.closest('[data-calls]')){st.calls=st.calls===false;render();return}
  const tr=e.target.closest('tr[data-sel]');
  if(tr&&!e.target.closest('button,input,select')){st.sel=st.sel===tr.dataset.sel?null:tr.dataset.sel;render();if(st.sel)window.scrollTo({top:0,behavior:'smooth'})}});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.id==='monthsel'){setMonth(el.value);if(!st.admin)st.tab='tablero';render()}
  else if(el.id==='hab'){const v=Math.max(1,Math.min(31,parseInt(el.value)||HAB));MONTHS[MKEY].hab=HAB=v;if(st.capDay>HAB)st.capDay=HAB;render()}
  else if(el.id==='costo'){const v=parseFloat(el.value.replace(/,/g,''));if(v>0){MONTHS[MKEY].costo=COSTO=v}render()}
  else if(el.classList.contains('lm')||el.classList.contains('ca')){const tr=el.closest('tr'),rr=SEGS.find(x=>x.id===tr.dataset.seg).rows[+tr.dataset.i],v=Math.max(0,Math.round(parseFloat(el.value.replace(/,/g,''))||0));
    if(el.classList.contains('lm')){rr.ll=rr.ll||{m:0,d:pad31([])};rr.ll.m=v}else{rr.cl=rr.cl||{asig:0,d:pad31([])};rr.cl.asig=v}render()}
  else if(el.classList.contains('ob')||el.classList.contains('nm')){const tr=el.closest('tr'),s=SEGS.find(x=>x.id===tr.dataset.seg),r=s.rows[+tr.dataset.i];
    if(el.classList.contains('ob')){const v=parseFloat(el.value.replace(/,/g,''));if(!isNaN(v)&&v>=0)r.o=v}else if(el.value.trim())r.n=el.value.trim();render()}

  if(e.target.id==='cut'){st.cut=+e.target.value;render()}
  if(e.target.id==='capday'){st.capDay=+e.target.value;render()}
});
document.addEventListener('input',e=>{if(e.target.classList.contains('cap'))capRecalc()});
let drag=null;
document.addEventListener('dragstart',e=>{const g=e.target.closest&&e.target.closest('.grip');if(!g)return;const tr=g.closest('tr');drag={seg:tr.dataset.seg,i:+tr.dataset.i};e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain','x');e.dataTransfer.setDragImage(tr,10,10)});
document.addEventListener('dragover',e=>{const tr=e.target.closest&&e.target.closest('tr[data-seg]');document.querySelectorAll('tr.over').forEach(x=>x.classList.remove('over'));if(drag&&tr&&tr.dataset.seg===drag.seg){e.preventDefault();tr.classList.add('over')}});
document.addEventListener('drop',e=>{const tr=e.target.closest&&e.target.closest('tr[data-seg]');if(drag&&tr&&tr.dataset.seg===drag.seg){e.preventDefault();const s=SEGS.find(x=>x.id===drag.seg),[it]=s.rows.splice(drag.i,1);s.rows.splice(+tr.dataset.i,0,it);drag=null;render();toast('Orden actualizado')}});
document.addEventListener('dragend',()=>{drag=null;document.querySelectorAll('tr.over').forEach(x=>x.classList.remove('over'))});
$('#yr').textContent=new Date().getFullYear();
async function boot(){
  try{const r=await fetch('datos.json?t='+Date.now(),{cache:'no-store'});if(r.ok){const j=await r.json();if(j&&j.months)SRV=j}}catch(e){}
  pickDB();setMonth(startMonth());render();
}
boot();
</script></body></html>
