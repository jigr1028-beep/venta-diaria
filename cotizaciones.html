<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Cotizaciones y prefacturas | LLYASA</title>
<link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#141a26;--ink2:#566074;--line:#e1e4ea;--navy:#042c53;--blue:#0652ca;--yellow:#fab219;--blueSoft:#dce8fb;--green:#12784a;--greenSoft:#e0f3e8;--amber:#8a5a00;--amberSoft:#fdf0d3;--red:#b3261e;--redSoft:#fbe3e1;color-scheme:light}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Ubuntu,'Segoe UI',system-ui,sans-serif}
select,input,textarea,button{font:inherit;color:inherit}
select,input,textarea{background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:7px 9px}
button{cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:7px;padding:6px 11px}
button:hover{border-color:var(--blue)}:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
main{max-width:1240px;margin:0 auto;padding:0 16px 32px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.tile span{color:var(--ink2);font-size:12px}.tile b{display:block;font-size:24px;font-weight:650}.tile em{font-style:normal;color:var(--ink2);font-size:12px}
button.tile{text-align:left}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;align-items:center}.filters input{flex:1;min-width:200px}
.list{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.row{display:grid;grid-template-columns:minmax(240px,1fr) 84px 120px 250px 142px;gap:12px;padding:10px 14px;border-top:1px solid var(--line);align-items:center}
.row:first-child{border-top:0}.row.head{background:#fafbfc;font-size:12px;color:var(--ink2);font-weight:600;padding-top:8px;padding-bottom:8px}
.cli{min-width:0}.cli b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cli small{color:var(--ink2);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cli a{color:var(--blue);cursor:pointer;font-size:12px}
.num{text-align:right;font-variant-numeric:tabular-nums}
.pill{display:inline-block;border-radius:99px;padding:1px 8px;font-size:11px;font-weight:600;white-space:nowrap}
.a0{background:var(--greenSoft);color:var(--green)}.a1{background:#eef0f4;color:var(--ink2)}.a2{background:var(--amberSoft);color:var(--amber)}.a3{background:var(--redSoft);color:var(--red)}
.pri{background:var(--navy);color:#fff}.dup{background:var(--amberSoft);color:var(--amber)}
.acts{display:flex;gap:6px}.send{flex:1;line-height:1.2;min-height:42px}
.send small{display:block;font-size:10px}.send.done{background:var(--greenSoft);border-color:var(--green);color:var(--green);font-weight:600}
.firma{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--blue);border-radius:10px;padding:10px 14px;margin-bottom:14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.firma.falta{border-left-color:#d0342c;background:#fff8f7}.firma input{min-width:260px;flex:0 1 340px}
.firmas{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:16px}
.firmas label{font-size:12px;color:var(--ink2);font-weight:600}.firmas input{display:block;width:100%;margin-top:3px;font-weight:400}
.empty{padding:30px;text-align:center;color:var(--ink2)}
.more{display:block;margin:12px auto}
table{width:100%;border-collapse:collapse;background:var(--card);font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{font-size:12px;color:var(--ink2);background:#fafbfc}th:first-child,td:first-child{text-align:left}
tr.click{cursor:pointer}tr.click:hover{background:#f6f9fe}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:10px;margin-bottom:16px;background:var(--card)}
.meter{display:inline-block;width:70px;height:8px;background:var(--blueSoft);border-radius:4px;margin-right:7px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--blue);border-radius:0 4px 4px 0}
#veil{position:fixed;inset:0;background:#0b122066;display:none;z-index:5}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(480px,100%);background:#fff;z-index:6;padding:18px;overflow:auto;display:none;box-shadow:-8px 0 30px #0003}
#drawer h2{font-size:16px;margin:0 36px 2px 0}#drawer .x{position:absolute;top:12px;right:12px}
#drawer label{display:block;font-size:12px;color:var(--ink2);margin-top:10px}
#drawer input,#drawer select,#drawer textarea{width:100%}#drawer textarea{height:190px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hist{font-size:12px;color:var(--ink2);padding-left:18px}
.note{font-size:12px;color:var(--ink2)}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 14px;border-radius:8px;display:none;z-index:9;max-width:92%}
@media(max-width:900px){.tiles{grid-template-columns:1fr 1fr}.row{grid-template-columns:1fr auto}.row.head{display:none}.cli,.acts{grid-column:1/-1}.bar label,.bar select{width:100%}}

main{max-width:1240px;margin:0 auto;padding:0 16px 32px}[hidden]{display:none!important}
.site{background:var(--blue);color:#fff}.site .in{max-width:1240px;margin:0 auto;padding:22px 16px;display:flex;gap:16px 32px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.logo{display:block;height:46px;width:auto;max-width:100%}.navs{display:flex;gap:6px 26px;flex-wrap:wrap}
.tab,.tab:hover{background:none;border:0;border-bottom:2px solid transparent;border-radius:0;color:#fff;font-weight:700;font-size:15px;padding:6px 0;text-decoration:none;white-space:nowrap}.tab[aria-selected=true]{border-bottom-color:#fff}
h1{font-size:30px;font-weight:500;margin:24px 0 2px;line-height:1.2}.sub{color:var(--ink2);font-size:13px;margin-bottom:16px}
.bar{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:14px}.bar label{font-size:13px}.bar select{display:block;margin-top:3px;min-width:260px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px;max-width:760px}.card h2{font-size:16px;margin:0 0 6px}.card input{max-width:100%}
.btn{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:700}button:disabled{opacity:.5;cursor:default}.aviso{background:var(--amberSoft);color:var(--amber);border-radius:8px;padding:9px 12px;margin-bottom:12px;font-size:13px}
.row .cli small:last-child{white-space:normal}
button.tile.on{border-color:var(--blue);box-shadow:inset 0 -3px 0 var(--yellow)}
</style></head><body>

const store={get(k,d){try{return JSON.parse(localStorage.getItem('llyasa_cot_'+k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem('llyasa_cot_'+k,JSON.stringify(v))}catch(e){}}};
const EJ=["BACHOCO","EJECUTIVO2","EJECUTIVO5","EJECUTIVO6","EJECUTIVO7","EJECUTIVO8","EJECUTIVO9","MAYOREO","NACIONALES",...[16,17,18,19,20,21,22,23,26,27,28].map(n=>'VENTAS'+n)];

let S=store.get('seg',{}),C=store.get('con',{}),DB={v:1,names:{},cortes:[]},ALL={C:[],P:[]},BY={},PW='',admin=false,dirty=false,existe=false,prevF='',grupo='pre';
const dia=s=>Date.parse(s+'T00:00:00Z')/864e5;
const dmy=s=>s.slice(8,10)+'/'+s.slice(5,7);
const largo=s=>`${dmy(s)}/${s.slice(0,4)}`;
const firma=e=>(DB.names[e]||'').trim();
const quien=e=>firma(e)?`${firma(e)} · ${e}`:e;
const actual=()=>DB.cortes[DB.cortes.length-1];
/* ---------- Excel ---------- */
async function unzip(buf){
 const u=new Uint8Array(buf),v=new DataView(buf);let e=u.length-22;while(e>=0&&v.getUint32(e,true)!==0x06054b50)e--;
 if(e<0)throw new Error('no es un archivo .xlsx');
 const out={};let p=v.getUint32(e+16,true);
 for(let i=0,n=v.getUint16(e+10,true);i<n;i++){
  const m=v.getUint16(p+10,true),cs=v.getUint32(p+20,true),nl=v.getUint16(p+28,true),xl=v.getUint16(p+30,true),cl=v.getUint16(p+32,true),lo=v.getUint32(p+42,true);
  const name=new TextDecoder().decode(u.subarray(p+46,p+46+nl)),start=lo+30+v.getUint16(lo+26,true)+v.getUint16(lo+28,true),data=u.slice(start,start+cs);
  out[name]=async()=>new TextDecoder().decode(m?await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer():data);
  p+=46+nl+xl+cl}
 return out;
}
async function leerExcel(buf,nombre){
 const z=await unzip(buf),xml=s=>new DOMParser().parseFromString(s,'application/xml'),tags=(n,t)=>[...n.getElementsByTagNameNS('*',t)];
 const ss=z['xl/sharedStrings.xml']?tags(xml(await z['xl/sharedStrings.xml']()),'si').map(si=>tags(si,'t').filter(t=>t.parentNode.localName!=='rPh').map(t=>t.textContent).join('')):[];
 const out={C:[],P:[]},vistos=new Set();let hojas=0;
 for(const name of Object.keys(z).filter(n=>/^xl\/worksheets\/[^/]+\.xml$/.test(n))){
  let head=null;
  for(const row of tags(xml(await z[name]()),'row')){
   const r={};
   for(const c of tags(row,'c')){const col=(c.getAttribute('r')||'').replace(/\d/g,''),t=c.getAttribute('t'),val=tags(c,'v')[0]?.textContent;
    r[col]=t==='s'?ss[+val]:t==='inlineStr'?tags(c,'t').map(x=>x.textContent).join(''):t==='str'?val:val==null?'':+val}
   if(!head){const h=Object.fromEntries(Object.entries(r).map(([k,v])=>[String(v).trim(),k]));if(['Importe','Cotizacion','Fecha','Cliente','Status','Ejecutivo'].every(k=>k in h)){head=h;hojas++}continue}
   const g=k=>r[head[k]]??'',st=String(g('Status')).toUpperCase(),tipo=st.includes('PRE')?'P':st.includes('COTIZ')?'C':null,imp=g('Importe'),f=g('Fecha');
   if(!tipo||typeof imp!=='number'||typeof f!=='number'||!g('Cotizacion'))continue;
   const folio=String(g('Cotizacion')).trim();if(vistos.has(tipo+folio))continue;vistos.add(tipo+folio);
   const s=k=>String(g(k)).trim(),ant=g('Antiguedad');
   out[tipo].push([folio,new Date(Date.UTC(1899,11,30)+Math.floor(f)*864e5).toISOString().slice(0,10),typeof ant==='number'&&tipo==='P'?ant:null,s('Cliente'),s('Referencia'),s('Sucursal'),s('Ejecutivo').toUpperCase(),Math.round(imp*100)/100,s('OC')]);
  }
 }
 if(!hojas)throw new Error('no encontré las columnas Importe, Cotizacion, Fecha, Cliente, Status y Ejecutivo');
 if(!out.C.length&&!out.P.length)throw new Error('no hay renglones de cotización ni prefactura');
 const fechas=[...out.C,...out.P].map(r=>r[1]).sort(),M='ene feb mar abr may jun jul ago sep oct nov dic'.split(' ');
 let f=fechas[fechas.length-1];const m=nombre.toLowerCase().match(/al[ _-]+(\d{1,2})[ _-]+(?:de[ _-]+)?([a-z]{3})/);
 if(m&&M.includes(m[2]))f=`${f.slice(0,4)}-${String(M.indexOf(m[2])+1).padStart(2,'0')}-${m[1].padStart(2,'0')}`;
 return{f,archivo:nombre,...out};
}
function agregarCorte(c){DB.cortes=DB.cortes.filter(x=>x.f!==c.f).concat(c).sort((a,b)=>a.f.localeCompare(b.f)).slice(-8);dirty=true;preparar()}
/* ---------- cifrado ---------- */
const b64=u=>{let s='';for(let i=0;i<u.length;i+=32768)s+=String.fromCharCode(...u.subarray(i,i+32768));return btoa(s)};
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function llave(pw,salt){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
 return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:600000,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
const flujo=async(data,T)=>new Uint8Array(await new Response(new Blob([data]).stream().pipeThrough(new T('gzip'))).arrayBuffer());
async function cifrar(pw){const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
 const d=await crypto.subtle.encrypt({name:'AES-GCM',iv},await llave(pw,salt),await flujo(JSON.stringify(DB),CompressionStream));
 return JSON.stringify({v:1,salt:b64(salt),iv:b64(iv),data:b64(new Uint8Array(d))})}
async function descifrar(j,pw){const d=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(j.iv)},await llave(pw,unb64(j.salt)),unb64(j.data));
 return JSON.parse(new TextDecoder().decode(await flujo(d,DecompressionStream)))}
/* ---------- datos del corte ---------- */
function preparar(){
 const c=actual();ALL={C:[],P:[]};BY={};if(!c)return;
 for(const t of['C','P']){const n={};c[t].forEach(r=>{const k=r[3]+'|'+r[7];n[k]=(n[k]||0)+1});
  ALL[t]=c[t].filter(r=>EJ.includes(r[6])).map(r=>({k:t+r[0],t,folio:r[0],fecha:dmy(r[1]),dias:r[2]??Math.max(0,dia(c.f)-dia(r[1])),cli:r[3],ref:r[4],suc:r[5],ej:r[6],imp:r[7],oc:r[8],dup:n[r[3]+'|'+r[7]]>1}));
  ALL[t].forEach(r=>BY[r.k]=r)}
}
/* Compara dos cortes por folio. Solo juzga ejecutivos presentes en ambos y no da por cerrado lo anterior al periodo del archivo nuevo. */
function comparar(a,b){
 const idx=l=>new Map(l.map(r=>[r[0],r])),bc=idx(b.C),bp=idx(b.P),ac=idx(a.C),ap=idx(a.P);
 const ejA=new Set([...a.C,...a.P].map(r=>r[6])),ejB=new Set([...b.C,...b.P].map(r=>r[6])),amb=new Set(EJ.filter(e=>ejA.has(e)&&ejB.has(e)));
 const ini=[...b.C,...b.P].reduce((m,r)=>r[1]<m?r[1]:m,'9999');
 const g={pre:[],sigue:[],psigue:[],salio:[],nueva:[],psalio:[],fuera:[]};
 const add=(k,r,e)=>{if(amb.has(e))g[k].push({folio:r[0],fecha:r[1],cli:r[3],ref:r[4],ej:e,imp:r[7]})};
 for(const[f,r]of ac){const n=bp.get(f)||bc.get(f),e=n&&amb.has(n[6])?n[6]:r[6];add(bp.has(f)?'pre':bc.has(f)?'sigue':r[1]<ini?'fuera':'salio',n||r,e)}
 for(const[f,r]of ap){const n=bp.get(f);if(n)add('psigue',n,amb.has(n[6])?n[6]:r[6]);else if(!bc.has(f))add(r[1]<ini?'fuera':'psalio',r,r[6])}
 for(const[f,r]of bc){if(!ac.has(f)&&!ap.has(f))add('nueva',r,r[6])}
 return{g,amb,ini};
}

 $('#xl').onchange=async ev=>{const ok=[],mal=[];for(const f of ev.target.files){try{const c=await leerExcel(await f.arrayBuffer(),f.name);agregarCorte(c);ok.push(largo(c.f))}catch(e){mal.push(`${f.name}: ${e.message}`)}}
  msgU=(ok.length?`Cortes cargados: ${ok.join(', ')}. Revisa y publica. `:'')+(mal.length?`No se pudo leer ${mal.join('; ')}`:'');opciones();render()};
 $('#nom').onchange=async ev=>{try{const n=JSON.parse(await ev.target.files[0].text());EJ.forEach(e=>{if(typeof n[e]==='string')DB.names[e]=n[e]});dirty=true;msgU='Nombres cargados.'}catch(e){msgU='Ese archivo de nombres no se pudo leer.'}opciones();render()};
 const clave=()=>{const a=$('#pw1').value;if(a.length<12){toast('La clave debe tener al menos 12 caracteres.');return null}if(a!==$('#pw2').value){toast('Las claves no coinciden.');return null}return a};
 $('#baj').onclick=async()=>{const k=clave();if(!k)return;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([await cifrar(k)],{type:'application/json'}));a.download=ARCH;document.body.appendChild(a);a.click();a.remove();PW=k;msgU=`Archivo descargado. Súbelo al repositorio junto a la página.`;render()};
 $('#pub').onclick=async()=>{const k=clave();if(!k)return;$('#pub').disabled=true;
  try{const url=`https://api.github.com/repos/${g.o}/${g.r}/contents/${ARCH}`,H={Authorization:'Bearer '+g.t,Accept:'application/vnd.github+json'},br=g.b||'main';
   const q=await fetch(url+'?ref='+encodeURIComponent(br),{headers:H,cache:'no-store'});if(!q.ok&&q.status!==404)throw new Error(q.status);
   const sha=q.ok?(await q.json()).sha:undefined,txt=await cifrar(k);
   const r=await fetch(url,{method:'PUT',headers:H,body:JSON.stringify({message:'Cotizaciones corte '+actual().f,content:b64(new TextEncoder().encode(txt)),sha,branch:br})});if(!r.ok)throw new Error(r.status);
   PW=k;store.set('pw',k);dirty=false;existe=true;msgU='Publicado. GitHub tarda uno o dos minutos en mostrarlo.'}catch(e){msgU=`No se pudo publicar (${e.message}). Revisa el acceso en Venta diaria o descarga el archivo.`}render()};
}
const taps=[];
document.addEventListener('click',e=>{
 if(e.target.closest('h1')&&!bloqueado){const n=Date.now();taps.push(n);while(taps.length&&n-taps[0]>1500)taps.shift();
  if(taps.length>=3){taps.length=0;admin=!admin;if(admin&&!actual())tab='U';render();toast(admin?'Modo coordinación activado':'Modo coordinación oculto');return}}
 const el=e.target.closest('[data-tab],[data-send],[data-open],[data-ej],[data-grupo],[data-quitar]');if(!el)return;const d=el.dataset;
 if(d.tab){tab=d.tab;lim=40;F.suc='';render()}else if(d.send)send(d.k,d.send);else if(d.open)openD(d.open);else if(d.grupo){grupo=d.grupo;comparativo()}
 else if(d.quitar){DB.cortes=DB.cortes.filter(c=>c.f!==d.quitar);dirty=true;preparar();render()}
 else if(d.ej){ejSel.value=d.ej;store.set('ej',d.ej);tab='C';F.suc='';render();scrollTo(0,0)}});
document.addEventListener('input',e=>{const f=e.target.dataset.firma;if(f){DB.names[f]=e.target.value;dirty=true;opciones();document.querySelectorAll(`[data-nom="${f}"]`).forEach(n=>n.textContent=quien(f))}});
document.addEventListener('change',e=>{const k=e.target.dataset.est;if(!k)return;const s=st(k);s.estado=e.target.value;S[k]=s;store.set('seg',S);render()});
window.addEventListener('beforeunload',e=>{if(dirty&&!window.__PREVIEW__)e.preventDefault()});
let bloqueado=false;
function listo(){bloqueado=false;preparar();opciones();render()}
async function boot(){
 if(window.__PREVIEW__){DB=window.__PREVIEW__;return listo()}
 let j=null;
 try{const r=await fetch(ARCH+'?t='+Date.now(),{cache:'no-store'});if(r.ok)j=await r.json();else if(r.status!==404)throw 0}catch(e){bloqueado=true;$('#bar').hidden=true;$('#view').innerHTML='<div class="card"><h2>No se pudieron cargar las cotizaciones</h2><p class="note">Abre esta página desde la liga publicada y vuelve a intentar.</p></div>';return}
 if(!j)return listo();existe=true;
 const abrir=async k=>{DB=await descifrar(j,k);PW=k;store.set('pw',k);listo()};
 const g=store.get('pw','');if(g){try{return await abrir(g)}catch(e){}}
 bloqueado=true;$('#bar').hidden=true;
 $('#view').innerHTML='<form class="card" id="gate"><h2>Acceso del equipo</h2><p class="note">Escribe la clave que te dio tu coordinador. Se recordará en este equipo.</p><input type="password" id="pw" aria-label="Clave" required> <button class="btn">Entrar</button><p id="err" class="note"></p></form>';
 $('#gate').onsubmit=async e=>{e.preventDefault();$('#err').textContent='Abriendo…';try{await abrir($('#pw').value)}catch(x){$('#err').textContent='Clave incorrecta.'}};
}
boot();

</script></body></html>
